name: Course CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Verify (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require PowerShell 7
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) {
            throw "PowerShell 7 is required for the environment journey; found $($PSVersionTable.PSVersion)"
          }
          Write-Host "Using PowerShell $($PSVersionTable.PSVersion)"
      - name: Install site dependencies
        run: npm ci
      - name: Install Chromium for browser verification
        run: npm run browser:install
      - name: Validate course contracts
        run: npm run test:python
      - name: Run offline release audit
        run: npm run audit:release
      - name: Run offline accessibility audit
        run: npm run audit:accessibility
      - name: Typecheck site
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify public homepage contract
        run: npm run test:site
      - name: Verify public browser routes
        run: npm run test:browser
