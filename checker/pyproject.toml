[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-engineering-course-checker"
version = "0.1.0"
description = "Local evidence checker for Agent 工程入门"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["."]
include = ["course_check*"]

